name: Windows installer
on:
  push:
    branches: [main, release/windows-suite-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install approved CI build tools
        run: python -m pip install pyinstaller==6.20.0

      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build per-user installer
        run: python scripts/build_windows.py
      - name: Test install, installed runtime, update and uninstall
        run: python scripts/verify_windows_install.py
      - name: Security scan and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = @('Unsigned Windows x64 build. No security bypasses installed.')
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status -and $status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath "$pwd\dist"
            $report += 'Microsoft Defender custom scan completed.'
          } else {
            $report += 'Microsoft Defender scan unavailable on this runner; no antivirus acceptance claim.'
          }
          $report | Out-File dist/installer/SECURITY-REPORT.txt -Encoding utf8
          Get-ChildItem dist/installer/*setup.exe | ForEach-Object { $h = Get-FileHash $_ -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SendToDevice-windows-installer
          path: |
            dist/installer/*
            dist/corresponding-source.zip
